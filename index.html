<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คูปองคงเหลือ DoHome</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --ink:#1c2433; --muted:#6b7587; --line:#e3e7ef;
    --brand:#d9262c; --brand-d:#b11d22; --ok:#1a8f4c; --warn:#c77700;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:16px;line-height:1.5}
  header{background:var(--brand);color:#fff;padding:14px 16px 0}
  header h1{margin:0 0 10px;font-size:19px;font-weight:700}
  .tabs{display:flex;gap:4px}
  .tab{flex:1;text-align:center;padding:10px 6px;border:0;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:500;border-radius:10px 10px 0 0;cursor:pointer}
  .tab.active{background:var(--bg);color:var(--brand-d);font-weight:700}
  main{max-width:720px;margin:0 auto;padding:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-weight:500;margin:0 0 6px}
  .field{margin-bottom:14px}
  select,input,textarea{width:100%;padding:12px;font:inherit;border:1px solid #cfd5e1;border-radius:10px;background:#fff;color:var(--ink)}
  select:focus,input:focus,textarea:focus{outline:2px solid #f3a6a9;border-color:var(--brand)}
  .amount{font-size:22px;font-weight:700;text-align:right}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--brand-d)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:#fff;color:var(--brand-d);border:1px solid var(--brand);font-size:15px;padding:10px}
  .info{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .info div{background:#f8f9fc;border-radius:10px;padding:10px}
  .info small{display:block;color:var(--muted);font-size:13px}
  .info b{font-size:17px}
  .last{margin-top:12px;padding:12px;border-radius:10px;background:#eef8f2;border:1px solid #cdebd9}
  .last.empty{background:#fff6e8;border-color:#f3dcb4;color:var(--warn)}
  .last .v{font-size:22px;font-weight:700;color:var(--ok)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat small{color:var(--muted)}
  .stat b{display:block;font-size:22px}
  .bar{height:8px;background:#e8ecf3;border-radius:99px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--ok);width:0}
  .chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{padding:7px 14px;border-radius:99px;border:1px solid #cfd5e1;background:#fff;font:inherit;font-size:14px;cursor:pointer}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:15px}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:500;font-size:13px;position:sticky;top:0;background:var(--card)}
  td.num,th.num{text-align:right}
  .tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
  .tag.no{background:#fff0e0;color:var(--warn)}
  .tag.yes{background:#e3f6ea;color:var(--ok)}
  .demo{background:#fff6e8;border:1px solid #f3dcb4;color:#8a5200;padding:10px 14px;font-size:14px;text-align:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#1c2433;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .row h2{margin:0;font-size:17px}
</style>
</head>
<body>

<header>
  <h1>🎟️ คูปองคงเหลือ DoHome</h1>
  <div class="tabs">
    <button class="tab active" data-tab="entry">กรอกข้อมูล</button>
    <button class="tab" data-tab="summary">สรุปทุกสาขา</button>
  </div>
</header>
<div id="demoBanner" class="demo hidden">โหมดทดลอง: ข้อมูลเก็บในเครื่องนี้เท่านั้น (ยังไม่ได้ใส่ค่า Firebase)</div>

<main>
  <!-- ===== กรอกข้อมูล ===== -->
  <section id="entry">
    <div class="card">
      <div class="field">
        <label for="branch">สาขา</label>
        <select id="branch"><option value="">— เลือกสาขา —</option></select>
      </div>

      <div id="branchInfo" class="hidden">
        <div class="info">
          <div><small>เป้าการขาย (ก.ย. 69)</small><b id="iTarget">-</b></div>
          <div><small>ยอดขาย Beger</small><b id="iSales">-</b></div>
          <div><small>Achev %</small><b id="iAch">-</b></div>
        </div>
        <div id="lastBox" class="last"></div>
      </div>
    </div>

    <div class="card hidden" id="formCard">
      <div class="field">
        <label for="pc">ชื่อผู้กรอก (PC)</label>
        <input id="pc" type="text" placeholder="เช่น คุณสมหญิง" autocomplete="name">
      </div>
      <div class="field">
        <label for="amount">จำนวนคูปองคงเหลือ ณ ปัจจุบัน (บาท)</label>
        <input id="amount" class="amount" type="text" inputmode="decimal" placeholder="0.00">
      </div>
      <div class="field">
        <label for="note">หมายเหตุ (ถ้ามี)</label>
        <textarea id="note" rows="2" placeholder="เช่น คูปองหมดอายุสิ้นเดือน"></textarea>
      </div>
      <button id="saveBtn" class="btn">บันทึก</button>
    </div>
  </section>

  <!-- ===== สรุป ===== -->
  <section id="summary" class="hidden">
    <div class="stats">
      <div class="stat"><small>กรอกแล้ว</small><b id="sDone">0 / 0</b><div class="bar"><i id="sBar"></i></div></div>
      <div class="stat"><small>คูปองคงเหลือรวม (บาท)</small><b id="sTotal">0</b></div>
    </div>
    <div class="chips">
      <button class="chip active" data-f="all">ทั้งหมด</button>
      <button class="chip" data-f="no">ยังไม่กรอก</button>
      <button class="chip" data-f="yes">กรอกแล้ว</button>
    </div>
    <div class="card" style="padding:6px 10px">
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>สาขา</th><th class="num">คงเหลือ (บาท)</th><th>สถานะ</th><th>ผู้กรอก</th><th>อัปเดตล่าสุด</th></tr></thead>
          <tbody id="sBody"></tbody>
        </table>
      </div>
    </div>
    <button class="btn ghost" id="exportBtn">⬇️ ดาวน์โหลด Excel</button>
  </section>
</main>

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   1) ตั้งค่า Firebase  — ใส่ค่าจาก Firebase Console > Project settings > Your apps (Web)
   ถ้ายังไม่ใส่ แอปจะทำงานแบบ "โหมดทดลอง" เก็บข้อมูลในเครื่องเท่านั้น
   ============================================================ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

/* ============================================================
   2) รายชื่อสาขา + ข้อมูลอ้างอิง (จากไฟล์ รอทำ_Google_form.xlsx, ก.ย. 2026)
   ============================================================ */
const BRANCHES = [
  {id:'b01',name:'DH หาดใหญ่',target:770000,sales:1277194.99},
  {id:'b02',name:'DH ภูเก็ต',target:600000,sales:874323.33},
  {id:'b03',name:'DH บ่อวิน',target:600000,sales:793859.42},
  {id:'b04',name:'DH บางนา',target:350000,sales:439983.73},
  {id:'b05',name:'DH ชลบุรี(อมตะนคร)',target:1100000,sales:1357162.96},
  {id:'b06',name:'DH แหลมฉบัง (บางละมุง)',target:880000,sales:1014522.31},
  {id:'b07',name:'DH เชียงราย',target:735000,sales:831206.74},
  {id:'b08',name:'DH บุรีรัมย์',target:750000,sales:835277.16},
  {id:'b09',name:'DH มาบตะพุด',target:960000,sales:1054687.88},
  {id:'b10',name:'DH สุราษฎร์ธานี',target:1400000,sales:1536118.92},
  {id:'b11',name:'DH เพชรเกษม',target:624000,sales:678475.62},
  {id:'b12',name:'DH ขอนแก่น',target:1300000,sales:1413331.41},
  {id:'b13',name:'DH บางพูน',target:440000,sales:476546.87},
  {id:'b14',name:'DH พระราม 2',target:560000,sales:567643.99},
  {id:'b15',name:'DH พิษณุโลก',target:1100000,sales:1106367.34},
  {id:'b16',name:'DH อุบลราชธานี',target:2300000,sales:2221844.68},
  {id:'b17',name:'DH รังสิต',target:1480000,sales:1403777.21},
  {id:'b18',name:'DH โคราช',target:2200000,sales:2065020.57},
  {id:'b19',name:'DH เชียงใหม่',target:1050000,sales:919295.38},
  {id:'b20',name:'DH ชัยภูมิ',target:900000,sales:754053.94},
  {id:'b21',name:'DH สุรินทร์',target:1000000,sales:815384.88},
  {id:'b22',name:'DH กาญจนบุรี',target:520000,sales:409753.14},
  {id:'b23',name:'DH นครสวรรค์',target:350000,sales:260307.51},
  {id:'b24',name:'DH บางบัวทอง',target:600000,sales:439905.00},
  {id:'b25',name:'DH อุดรธานี',target:900000,sales:623054.05},
  {id:'b26',name:'DH เทพารักษ์',target:400000,sales:242982.44},
  {id:'b27',name:'DH อยุธยา',target:520000,sales:301189.15}
];

/* ============================================================
   3) ชั้นเก็บข้อมูล (Firestore หรือ localStorage ถ้าเป็นโหมดทดลอง)
   - คอลเลกชัน coupon_balance/{branchId} = ยอดล่าสุดของแต่ละสาขา
   - คอลเลกชัน coupon_log               = ประวัติการกรอกทุกครั้ง
   ============================================================ */
const CONFIGURED = firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('YOUR');
let db = null;
let balances = {};          // { branchId: {amount, pc, note, updatedAt(Date)} }
const DEMO_KEY = 'coupon_balance_demo';

function toDate(v){
  if(!v) return null;
  if(typeof v.toDate === 'function') return v.toDate();
  const d = new Date(v); return isNaN(d) ? null : d;
}

function initStore(){
  if(CONFIGURED){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    db.collection('coupon_balance').onSnapshot(snap=>{
      const next = {};
      snap.forEach(doc=>{
        const d = doc.data({serverTimestamps:'estimate'});
        next[doc.id] = {amount:d.amount, pc:d.pc||'', note:d.note||'', updatedAt:toDate(d.updatedAt)};
      });
      balances = next; refreshAll();
    }, err=>{ console.error(err); toast('โหลดข้อมูลไม่สำเร็จ: '+err.message); });
  }else{
    document.getElementById('demoBanner').classList.remove('hidden');
    try{
      const raw = JSON.parse(localStorage.getItem(DEMO_KEY)||'{}');
      Object.keys(raw).forEach(k=> balances[k] = {...raw[k], updatedAt:toDate(raw[k].updatedAt)});
    }catch(e){ balances = {}; }
    refreshAll();
  }
}

async function saveBalance(branch, amount, pc, note){
  if(db){
    const batch = db.batch();
    const ts = firebase.firestore.FieldValue.serverTimestamp();
    batch.set(db.collection('coupon_balance').doc(branch.id),
      {branchId:branch.id, branchName:branch.name, amount, pc, note, updatedAt:ts});
    batch.set(db.collection('coupon_log').doc(),
      {branchId:branch.id, branchName:branch.name, amount, pc, note, createdAt:ts});
    await batch.commit();
  }else{
    balances[branch.id] = {amount, pc, note, updatedAt:new Date()};
    localStorage.setItem(DEMO_KEY, JSON.stringify(balances));
    refreshAll();
  }
}

/* ============================================================
   4) UI
   ============================================================ */
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0 = n => Number(n).toLocaleString('th-TH',{maximumFractionDigits:0});
const fmtDate = d => d ? d.toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

// tabs
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  $('entry').classList.toggle('hidden', b.dataset.tab!=='entry');
  $('summary').classList.toggle('hidden', b.dataset.tab!=='summary');
}));

// branch select
BRANCHES.forEach(b=>{
  const o = document.createElement('option'); o.value=b.id; o.textContent=b.name; $('branch').appendChild(o);
});
$('branch').addEventListener('change', renderBranch);

function renderBranch(){
  const b = BRANCHES.find(x=>x.id===$('branch').value);
  $('branchInfo').classList.toggle('hidden', !b);
  $('formCard').classList.toggle('hidden', !b);
  if(!b) return;
  $('iTarget').textContent = fmt0(b.target);
  $('iSales').textContent = fmt0(b.sales);
  $('iAch').textContent = (b.sales/b.target*100).toFixed(1)+'%';
  const cur = balances[b.id];
  const box = $('lastBox');
  if(cur){
    box.className='last';
    box.innerHTML = `<small>คูปองคงเหลือล่าสุดที่บันทึกไว้</small><div class="v">${fmt(cur.amount)} บาท</div>
      <small>โดย ${esc(cur.pc)||'-'} • ${fmtDate(cur.updatedAt)}</small>`;
  }else{
    box.className='last empty';
    box.innerHTML = 'ยังไม่เคยมีการกรอกยอดคูปองของสาขานี้';
  }
}

// remember PC name
$('pc').value = localStorage.getItem('coupon_pc_name') || '';

$('saveBtn').addEventListener('click', async ()=>{
  const b = BRANCHES.find(x=>x.id===$('branch').value);
  const pc = $('pc').value.trim();
  const raw = $('amount').value.replace(/,/g,'').trim();
  const note = $('note').value.trim();
  if(!b) return toast('กรุณาเลือกสาขา');
  if(!pc) return toast('กรุณากรอกชื่อผู้กรอก');
  if(raw==='' || isNaN(Number(raw)) || Number(raw)<0) return toast('กรุณากรอกจำนวนเงินให้ถูกต้อง (0 หรือมากกว่า)');
  const amount = Math.round(Number(raw)*100)/100;
  if(!confirm(`ยืนยันบันทึก\n\nสาขา: ${b.name}\nคูปองคงเหลือ: ${fmt(amount)} บาท`)) return;

  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
  try{
    await saveBalance(b, amount, pc, note);
    localStorage.setItem('coupon_pc_name', pc);
    $('amount').value=''; $('note').value='';
    toast('✅ บันทึกเรียบร้อย');
  }catch(e){
    console.error(e); toast('บันทึกไม่สำเร็จ: '+e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'บันทึก';
  }
});

// summary
let filter = 'all';
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===c));
  renderSummary();
}));

function renderSummary(){
  const done = BRANCHES.filter(b=>balances[b.id]).length;
  const total = BRANCHES.reduce((s,b)=>s+(balances[b.id]?Number(balances[b.id].amount):0),0);
  $('sDone').textContent = `${done} / ${BRANCHES.length}`;
  $('sBar').style.width = (done/BRANCHES.length*100)+'%';
  $('sTotal').textContent = fmt(total);

  const rows = BRANCHES.filter(b=>{
    const has = !!balances[b.id];
    return filter==='all' || (filter==='yes'?has:!has);
  }).map(b=>{
    const c = balances[b.id];
    return `<tr>
      <td>${esc(b.name)}</td>
      <td class="num">${c?fmt(c.amount):'-'}</td>
      <td><span class="tag ${c?'yes':'no'}">${c?'กรอกแล้ว':'ยังไม่กรอก'}</span></td>
      <td>${c?esc(c.pc)||'-':'-'}</td>
      <td>${c?fmtDate(c.updatedAt):'-'}</td>
    </tr>`;
  }).join('');
  $('sBody').innerHTML = rows || '<tr><td colspan="5" style="text-align:center;color:#6b7587">ไม่มีรายการ</td></tr>';
}

$('exportBtn').addEventListener('click',()=>{
  const data = BRANCHES.map(b=>{
    const c = balances[b.id];
    return {
      'สาขา':b.name,
      'เป้าการขาย':b.target,
      'Beger':b.sales,
      'Achev %':b.sales/b.target,
      'จำนวนคูปองคงเหลือ / บาท': c?Number(c.amount):'',
      'ผู้กรอก': c?c.pc:'',
      'หมายเหตุ': c?c.note:'',
      'อัปเดตล่าสุด': c?fmtDate(c.updatedAt):''
    };
  });
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:26},{wch:12},{wch:14},{wch:9},{wch:24},{wch:16},{wch:24},{wch:20}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'คูปองคงเหลือ');
  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  XLSX.writeFile(wb, `coupon_balance_${stamp}.xlsx`);
});

function refreshAll(){ renderBranch(); renderSummary(); }

initStore();
renderSummary();
</script>
</body>
</html>
